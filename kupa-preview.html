<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קופה - חנות הישיבה</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; direction: rtl; }

  /* Header */
  .header { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .tabs { display: flex; gap: 8px; }
  .tab { padding: 6px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
  .tab.active { background: white; color: #1d4ed8; }
  .tab.inactive { background: rgba(255,255,255,0.15); color: white; }
  .user-badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 12px; font-size: 12px; }

  /* Main layout */
  .main { display: flex; gap: 16px; padding: 16px; height: calc(100vh - 58px); }

  /* Left panel - cart */
  .cart-panel { flex: 1; background: white; border-radius: 16px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
  .cart-panel h2 { font-size: 16px; color: #1e3a8a; margin-bottom: 14px; font-weight: 700; }

  /* Buyer type */
  .buyer-type { display: flex; gap: 8px; margin-bottom: 14px; }
  .buyer-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #e2e8f0; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
  .buyer-btn.active { border-color: #1d4ed8; background: #eff6ff; color: #1d4ed8; }
  .buyer-btn:not(.active) { background: #f8fafc; color: #64748b; }

  /* Search bar */
  .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-input { flex: 1; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 9px 14px; font-size: 14px; outline: none; text-align: right; }
  .search-input:focus { border-color: #1d4ed8; }
  .icon-btn { background: #1d4ed8; color: white; border: none; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 600; }

  /* Cart items */
  .cart-items { flex: 1; overflow-y: auto; }
  .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #f8fafc; border-radius: 10px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
  .item-name { font-weight: 600; font-size: 14px; color: #1e293b; }
  .item-detail { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .item-controls { display: flex; align-items: center; gap: 8px; }
  .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid #e2e8f0; background: white; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #1d4ed8; }
  .qty { font-size: 14px; font-weight: 700; color: #1e293b; min-width: 20px; text-align: center; }
  .item-price { font-size: 14px; font-weight: 700; color: #1e3a8a; min-width: 55px; text-align: left; }
  .remove-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 16px; }

  /* Total */
  .total-section { border-top: 2px solid #e2e8f0; padding-top: 14px; margin-top: 8px; }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .total-label { font-size: 14px; color: #64748b; }
  .total-amount { font-size: 24px; font-weight: 800; color: #1e3a8a; }
  .pay-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #16a34a, #15803d); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(22,163,74,0.3); }

  /* Right panel - products */
  .products-panel { width: 280px; background: white; border-radius: 16px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
  .products-panel h2 { font-size: 15px; color: #1e3a8a; margin-bottom: 12px; font-weight: 700; }
  .category-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .cat-btn { padding: 4px 10px; border-radius: 20px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-size: 11px; cursor: pointer; color: #64748b; font-weight: 600; }
  .cat-btn.active { background: #eff6ff; border-color: #1d4ed8; color: #1d4ed8; }
  .product-list { flex: 1; overflow-y: auto; }
  .product-card { padding: 10px 12px; background: #f8fafc; border-radius: 10px; margin-bottom: 8px; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.15s; }
  .product-card:hover { border-color: #1d4ed8; background: #eff6ff; }
  .product-card-name { font-size: 13px; font-weight: 700; color: #1e293b; }
  .product-card-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .product-card-price { font-size: 13px; font-weight: 700; color: #16a34a; margin-top: 4px; }

  /* Empty cart */
  .empty-cart { text-align: center; color: #94a3b8; padding: 40px 0; font-size: 14px; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div style="display:flex;align-items:center;gap:16px;">
    <h1>🏪 חנות הישיבה</h1>
    <div class="tabs">
      <button class="tab active">קופה</button>
      <button class="tab inactive">ניהול</button>
    </div>
  </div>
  <div class="user-badge">👤 קופאי</div>
</div>

  <!-- Products Panel -->
  <div class="products-panel">
    <h2>📦 מוצרים</h2>
    <div class="category-filter">
      <button class="cat-btn active">הכל</button>
      <button class="cat-btn">מוצרי חלב</button>
      <button class="cat-btn">לחם</button>
      <button class="cat-btn">שתייה</button>
      <button class="cat-btn">חטיפים</button>
    </div>
    <div class="product-list">
      <div class="product-card">
        <div class="product-card-name">חלב תנובה 3%</div>
        <div class="product-card-sub">מוצרי חלב</div>
        <div class="product-card-price">₪5.90</div>
      </div>
      <div class="product-card">
        <div class="product-card-name">לחם אחיד</div>
        <div class="product-card-sub">לחם ומאפים</div>
        <div class="product-card-price">₪7.50</div>
      </div>
      <div class="product-card">
        <div class="product-card-name">גבינה צהובה</div>
        <div class="product-card-sub">מוצרי חלב | 200 גרם</div>
        <div class="product-card-price">₪12.90</div>
      </div>
      <div class="product-card">
        <div class="product-card-name">שוקו עלית</div>
        <div class="product-card-sub">שתייה | 500 מל</div>
        <div class="product-card-price">₪6.50</div>
      </div>
      <div class="product-card">
        <div class="product-card-name">במבה אסם</div>
        <div class="product-card-sub">חטיפים | 80 גרם</div>
        <div class="product-card-price">₪4.20</div>
      </div>
      <div class="product-card">
        <div class="product-card-name">יוגורט דנונה</div>
        <div class="product-card-sub">מוצרי חלב | 150 גרם</div>
        <div class="product-card-price">₪3.90</div>
      </div>
      <div class="product-card">
        <div class="product-card-name">מיץ טבעי תפוזים</div>
        <div class="product-card-sub">שתייה | 1 ליטר</div>
        <div class="product-card-price">₪11.90</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
